<!-- บท 06 · Voices (host เป็น section แล้วใน .ts) -->
<div class="mx-auto w-full max-w-[1160px]">
  <div appReveal class="mb-4 flex items-baseline gap-[14px]">
    <span class="font-mono text-xs uppercase tracking-[4px] text-primary">
      Chapter {{ nav.numberOf('voices') }}
    </span>
    <span class="h-px flex-1 bg-[linear-gradient(90deg,rgba(232,106,28,0.4),transparent)]"></span>
    <span class="font-mono text-[11px] text-ink-faint">Notes in the Margin</span>
  </div>
  <h2
    appReveal="60"
    class="mb-8 font-display text-[clamp(34px,5.5vw,60px)] font-normal tracking-[-1px] text-ink"
  >
    Words from <span class="italic text-primary-light">the party</span>
  </h2>

  <div class="grid gap-6 md:grid-cols-3">
    @for (voice of data.visibleTestimonials(); track voice.name) {
      <div
        appTilt
        appReveal
        class="rounded-[20px] border border-white/[0.09] bg-[linear-gradient(165deg,#17130e,#100d0a)] p-[26px] transition-[transform,border-color] duration-300"
      >
        <p class="font-display text-5xl leading-none text-primary" aria-hidden="true">“</p>
        <p class="mt-3 font-display text-[17px] italic leading-[1.6] text-ink-soft">
          {{ voice.review }}
        </p>
        <div class="mt-6 flex items-center gap-[14px]">
          <span
            class="grid h-11 w-11 flex-none place-items-center rounded-full border border-primary/28 bg-primary/10 font-mono text-sm text-primary"
          >
            {{ voice.avatar }}
          </span>
          <div>
            <div class="font-display text-base font-medium text-ink">{{ voice.name }}</div>
            <div class="font-mono text-[11px] text-ink-faint">
              {{ voice.position }} · {{ voice.company }}
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</div>

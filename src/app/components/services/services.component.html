<!-- บท 05 · Services / Commissions (host เป็น section แล้วใน .ts) -->
<div class="mx-auto w-full max-w-[1160px]">
  <div appReveal class="mb-4 flex items-baseline gap-[14px]">
    <span class="font-mono text-xs uppercase tracking-[4px] text-primary">
      Chapter {{ nav.numberOf('services') }}
    </span>
    <span class="h-px flex-1 bg-[linear-gradient(90deg,rgba(232,106,28,0.4),transparent)]"></span>
    <span class="font-mono text-[11px] text-ink-faint">Commissions</span>
  </div>
  <h2
    appReveal="60"
    class="mb-[10px] font-display text-[clamp(34px,5.5vw,60px)] font-normal tracking-[-1px] text-ink"
  >
    What I can <span class="italic text-primary-light">build for you</span>
  </h2>
  <p appReveal="100" class="mb-[30px] max-w-[560px] text-[15px] text-ink-mute">
    Practical builds I take on — from a single landing page to full internal tools.
  </p>

  <div class="grid gap-[18px] sm:grid-cols-2 lg:grid-cols-3">
    @for (service of data.services(); track service.title) {
      <div
        appTilt
        appReveal
        class="rounded-[16px] border border-white/[0.08] bg-[linear-gradient(165deg,#17130e,#100d0a)] p-[20px] transition-[transform,border-color] duration-300"
      >
        <span
          class="inline-flex h-9 items-center justify-center rounded-[9px] border border-primary/25 bg-primary/10 px-[10px] font-mono text-[11px] text-primary"
        >
          {{ service.icon }}
        </span>
        <h3 class="mt-4 font-display text-lg font-medium text-ink">{{ service.title }}</h3>
        <p class="mt-2 text-[13px] leading-[1.6] text-ink-mute">{{ service.description }}</p>
      </div>
    }
  </div>
</div>

<!-- บท 04 · Journey (host เป็น section แล้วใน .ts) -->
<div class="mx-auto w-full max-w-[1160px]">
  <div appReveal class="mb-4 flex items-baseline gap-[14px]">
    <span class="font-mono text-xs uppercase tracking-[4px] text-primary">
      Chapter {{ nav.numberOf('journey') }}
    </span>
    <span class="h-px flex-1 bg-[linear-gradient(90deg,rgba(232,106,28,0.4),transparent)]"></span>
    <span class="font-mono text-[11px] text-ink-faint">Chronology</span>
  </div>
  <h2
    appReveal="60"
    class="mb-[34px] font-display text-[clamp(34px,5.5vw,60px)] font-normal tracking-[-1px] text-ink"
  >
    The <span class="italic text-primary-light">journey</span> so far
  </h2>

  <div class="relative pl-[34px]">
    <div
      class="absolute bottom-[6px] left-[9px] top-[6px] w-[2px] bg-[linear-gradient(#e86a1c,#b8480e,rgba(184,72,14,0.1))]"
    ></div>
    <div class="flex flex-col gap-5">
      @for (entry of data.journey(); track entry.role) {
        <div appReveal class="relative">
          <span
            class="absolute left-[-33px] top-[7px] h-5 w-5 rounded-full border-2 border-primary bg-dark shadow-[0_0_13px_rgba(232,106,28,0.5)]"
          ></span>
          <div
            class="rounded-[16px] border border-white/[0.09] bg-[linear-gradient(165deg,#17130e,#100d0a)] p-[20px_24px]"
          >
            <div class="mb-[5px] flex flex-wrap items-baseline justify-between gap-2">
              <span class="font-display text-xl font-medium text-ink">{{ entry.role }}</span>
              <span class="font-mono text-xs text-primary">{{ entry.time }}</span>
            </div>
            <div class="mb-[9px] font-mono text-xs text-primary-light">{{ entry.org }}</div>
            <p class="text-sm leading-[1.6] text-ink-mute">{{ entry.desc }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</div>

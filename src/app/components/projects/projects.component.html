<!-- บท 03 · Quests (host เป็น section แล้วใน .ts) -->
<div class="mx-auto w-full max-w-[1160px]">
  <div appReveal class="mb-4 flex items-baseline gap-[14px]">
    <span class="font-mono text-xs uppercase tracking-[4px] text-primary">
      Chapter {{ nav.numberOf('quests') }}
    </span>
    <span class="h-px flex-1 bg-[linear-gradient(90deg,rgba(232,106,28,0.4),transparent)]"></span>
    <span class="font-mono text-[11px] text-ink-faint">Cleared Quests</span>
  </div>
  <h2
    appReveal="60"
    class="mb-8 font-display text-[clamp(34px,5.5vw,60px)] font-normal tracking-[-1px] text-ink"
  >
    Quests I <span class="italic text-primary-light">cleared</span>
  </h2>

  <div class="grid gap-6 md:grid-cols-2">
    @for (quest of data.quests(); track quest.name) {
      <div
        appTilt
        appReveal
        class="flex flex-col overflow-hidden rounded-[20px] border border-white/[0.09] bg-[linear-gradient(165deg,#17130e,#100d0a)] shadow-[0_24px_60px_rgba(0,0,0,0.45)] transition-[transform,border-color] duration-300"
      >
        <div class="relative h-[198px] overflow-hidden border-b border-white/[0.07]">
          @if (quest.img) {
            <img [src]="quest.img" [alt]="quest.name" class="h-full w-full object-cover object-top" />
          }
          <div
            class="absolute inset-0 bg-[linear-gradient(180deg,transparent_55%,rgba(16,13,10,0.85))]"
          ></div>
          <span
            class="absolute left-[14px] top-[14px] rounded-full border border-primary/40 bg-[rgba(12,11,10,0.8)] px-[11px] py-[5px] font-mono text-[11px] tracking-[0.5px] text-primary-light"
          >
            ✓ {{ quest.status }}
          </span>
          <span
            class="absolute right-[14px] top-[14px] rounded-full border border-white/[0.14] bg-[rgba(12,11,10,0.8)] px-[11px] py-[5px] font-mono text-[11px] text-ink-soft"
          >
            {{ quest.type }}
          </span>
        </div>
        <div class="flex flex-1 flex-col p-[22px]">
          <div class="mb-2 font-display text-[22px] font-medium text-ink">{{ quest.name }}</div>
          <p class="mb-4 flex-1 text-sm leading-[1.6] text-ink-mute">{{ quest.desc }}</p>
          <div class="mb-[18px] flex flex-wrap gap-[7px]">
            @for (tech of quest.tech; track tech) {
              <span
                class="rounded-[7px] border border-primary/[0.22] bg-primary/10 px-[10px] py-1 font-mono text-[11px] text-primary-light"
              >
                {{ tech }}
              </span>
            }
          </div>
          <div class="flex gap-[10px]">
            <a
              [href]="quest.live"
              target="_blank"
              rel="noopener noreferrer"
              class="rounded-[10px] bg-primary px-4 py-[10px] font-body text-[13px] font-semibold text-dark no-underline"
            >
              Open Live ↗
            </a>
            <a
              [href]="quest.code"
              target="_blank"
              rel="noopener noreferrer"
              class="rounded-[10px] border border-primary/40 px-4 py-[10px] font-body text-[13px] font-semibold text-primary-light no-underline"
            >
              GitHub
            </a>
          </div>
        </div>
      </div>
    }
  </div>
</div>
